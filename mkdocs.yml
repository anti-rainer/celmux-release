site_name: Celmux
site_description: Celmux 插件开发文档
repo_url: https://github.com/anti-rainer/celmux-release
repo_name: anti-rainer/celmux-release
edit_uri: ""

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.top
    - content.code.copy
    - header.autohide

plugins:
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh
          name: 简体中文
          build: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables

nav:
  - Home:
      - index.md
  - Plugin:
      - plugin/index.md
