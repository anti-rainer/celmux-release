# Build the released binaries here, from the private source repository.
#
# This repository carries no source: it carries the installers and the
# releases they download. A run checks `anti-rainer/celmux` out with a personal
# access token that can read it and builds the same targets `make` builds on a
# development machine.
#
#   Actions -> release -> Run workflow
#
#   source_ref  which source branch to build: main (default), rc, beta
#   version     build version; empty continues the last release (+0.0.1)
#   publish     create the release; unchecked keeps the binaries in the run
#   notify      report the result to Telegram
#
# A run that does not publish still builds everything: the version gains a
# `-dev.<date>-<revision>` marker instead, so a test build cannot be mistaken
# for a release, and the binaries stay downloadable from the run itself. A run
# that publishes takes the version as it stands and makes it `releases/latest`,
# which is what both installers fetch.
#
# One job per platform and component: a failure names the artifact it belongs
# to, and one broken component does not hide the state of the others.
#
#   windows-service  celmux_windows_amd64.exe               (mingw cross)
#   windows-desktop  celmux-desktop_windows_amd64.exe       (unfinished)
#   linux-service    celmux_linux_amd64 / _arm64            (musl, static)
#   linux-desktop    celmux-desktop_linux_amd64 / _arm64    (glibc, native)
#                    celmux-desktop_<version>_<arch>.deb
#
# The desktop links the host's glibc, so each of its architectures builds on a
# runner of that architecture; the service is static, so both of its
# architectures cross-build on x86. The Windows binary needs a mingw-w64 whose
# GCC knows `-mdirect-extern-access` (GCC 12+), which is why that half of the
# matrix is on 24.04 rather than 22.04.
#
# Assets, named after what the installers ask for:
#
#   celmux_windows_amd64.exe          install.ps1
#   celmux_linux_amd64                install.sh
#   celmux_linux_arm64                install.sh
#   SHA256SUMS                        checksum of every asset above
#
# Secrets: `celmux_pat` reads the private source; `TGBOT_TOKEN` and
# `TGBOT_CHATID` are the notifier's bot. All three are repository secrets
# (Settings -> Secrets and variables -> Actions), so every job can read them
# and no job has to declare an environment.

name: release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支'
        type: choice
        options:
          - main
          - rc
          - beta
        default: main
      version:
        description: '构建版本号（留空 = 上一个 release + 0.0.1）'
        type: string
        default: ''
      publish:
        description: '发布 release'
        type: boolean
        default: false
      notify:
        description: '发送 Telegram 通知'
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time: two runs would write into the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  ZIG_VERSION: 0.16.0
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.pick.outputs.version }}
      revision: ${{ steps.pick.outputs.revision }}
    steps:
      # Checked before anything else, because `actions/checkout` reports a
      # token that cannot read the private source as a plain clone failure.
      - name: Check what the token can read
        env:
          PAT: ${{ secrets.CELMUX_PAT }}
        run: |
          set -eu
          if [ -z "${PAT:-}" ]; then
            echo '::error::仓库密钥 celmux_pat 没有配置（Settings -> Secrets and variables -> Actions -> New repository secret）'
            exit 1
          fi
          # 令牌本身从不打印，但形状（类型、长度、有没有带空白）足以看出粘贴错误。
          trimmed=$(printf '%s' "$PAT" | tr -d '[:space:]')
          case "$PAT" in
            github_pat_*) kind='fine-grained' ;;
            ghp_*) kind='classic' ;;
            *) kind='未知（不以 github_pat_ / ghp_ 开头）' ;;
          esac
          if [ "$PAT" = "$trimmed" ]; then
            blanks='没有'
          else
            blanks='有（密钥里带了空格或换行，需要重新粘贴）'
          fi
          echo "celmux_pat：类型 ${kind}，长度 ${#PAT}，首尾空白 ${blanks}"
          who=$(curl -s -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user |
            python3 -c 'import json,sys;print(json.load(sys.stdin).get("login","未知"))')
          scopes=$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${PAT}" \
            https://api.github.com/user | tr -d '\r' |
            sed -n 's/^x-oauth-scopes: //p')
          echo "celmux_pat 属于账号 ${who}；scopes: ${scopes:-（无，fine-grained 令牌没有这个头）}"
          code=$(curl -s -o /tmp/source.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/anti-rainer/celmux)
          case "$code" in
            200)
              echo 'celmux_pat 可以读取 anti-rainer/celmux，继续。'
              ;;
            404)
              echo '::error::celmux_pat 读 anti-rainer/celmux 得到 404：令牌没有包含这个私有仓库。fine-grained 令牌要在 Repository access 里选中 anti-rainer/celmux 并给 Contents: Read；classic 令牌要有 repo 范围。'
              exit 1
              ;;
            401)
              echo '::error::celmux_pat 无效或已过期（HTTP 401）。'
              exit 1
              ;;
            *)
              echo "::error::celmux_pat 读 anti-rainer/celmux 失败（HTTP ${code}）：$(cat /tmp/source.json)"
              exit 1
              ;;
          esac
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          # The clone happens with the token; nothing later needs it, so it is
          # not left in the checkout for the build to read.
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Name the build
        id: pick
        shell: bash
        working-directory: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          revision=$(git rev-parse --short HEAD)
          describe=$(git describe --tags --always)

          # 0.0.1 for a version that carries no `X.Y.Z`, and the next patch for
          # every other shape the tags have taken (`1.0.3`, `1.0.3-fix2`,
          # `1.0.3-fix2-31-g4ebac6c`).
          next_version() {
            set -- $(printf '%s' "${1:-}" |
              sed -n 's/^[vV]*\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2 \3/p')
            if [ "$#" -ne 3 ]; then
              printf '0.0.1\n'
              return 0
            fi
            printf '%s.%s.%s\n' "$1" "$2" "$(( $3 + 1 ))"
          }

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq '.tagName' 2>/dev/null || true)
            [ -n "$previous" ] || previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
            echo "上一个版本：${previous:-无}"
            version=$(next_version "$previous")
          fi
          if [ "$PUBLISH" != 'true' ]; then
            version="$version-dev.$(date -u +%Y%m%d)-$revision"
          fi

          echo "构建版本 $version（$describe @ $revision）"
          {
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  windows-service:
    name: windows service
    needs: plan
    # 24.04 rather than 22.04: the 22.04 image ships mingw-w64 10, and the EVS
    # codec is compiled with `-mdirect-extern-access`, an option GCC only grew
    # in 12. Ubuntu 24.04 ships mingw-w64 13.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Cache cargo and the native codecs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/.build-cache
          key: windows-service-${{ hashFiles('source/Cargo.lock') }}
      - name: Set the Node.js version up
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Install the cross toolchain
        # Inside the source tree, so the target lands on the toolchain the
        # repository pins rather than on the runner's default one.
        working-directory: source
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          rustup target add x86_64-pc-windows-gnu
      - name: Build the service
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            make frontend-dist
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
            evs=$(sh scripts/build-evs-native.sh x86_64-pc-windows-gnu)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-app --bin celmux --release --locked \
              --target x86_64-pc-windows-gnu
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux.exe \
              dist/celmux_windows_amd64.exe
          } 2>&1 | tee /tmp/windows-service.log
      - name: Keep the binary
        uses: actions/upload-artifact@v6
        with:
          name: windows-service
          if-no-files-found: error
          path: source/dist/celmux_windows_amd64.exe
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -u
          for log in /tmp/*.log; do
            [ -f "$log" ] || continue
            echo "--- $log"
            tail -45 "$log"
            # A failed step's log needs repository admin rights to read, but
            # this annotation does not, so the tail travels as one.
            escaped=$(tail -45 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${log##*/}:${escaped}"
          done
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-service-logs
          if-no-files-found: ignore
          path: /tmp/*.log

  # The desktop client is still being built out on Windows: the job runs and its
  # binary joins the release when it compiles, and nothing else waits for it.
  windows-desktop:
    name: windows desktop
    needs: plan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 180
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Cache cargo and the native codecs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/.build-cache
          key: windows-desktop-${{ hashFiles('source/Cargo.lock') }}
      - name: Set the Node.js version up
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Install the cross toolchain
        working-directory: source
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          rustup target add x86_64-pc-windows-gnu
      - name: Build the desktop client
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            make frontend-dist
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
            evs=$(sh scripts/build-evs-native.sh x86_64-pc-windows-gnu)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-desktop --bin celmux-desktop --release --locked \
              --target x86_64-pc-windows-gnu
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux-desktop.exe \
              dist/celmux-desktop_windows_amd64.exe
          } 2>&1 | tee /tmp/windows-desktop.log
      - name: Keep the binary
        uses: actions/upload-artifact@v6
        with:
          name: windows-desktop
          if-no-files-found: warn
          path: source/dist/celmux-desktop_windows_amd64.exe
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -u
          for log in /tmp/*.log; do
            [ -f "$log" ] || continue
            echo "--- $log"
            tail -45 "$log"
            escaped=$(tail -45 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning::Windows 桌面端没有编出来（不影响本次发布）：${log##*/}:${escaped}"
          done
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-desktop-logs
          if-no-files-found: ignore
          path: /tmp/*.log

  # The service is a static musl binary, so both architectures build on x86:
  # amd64 through the Makefile, arm64 through cargo zigbuild, which is what
  # `.cargo/config.toml` expects to link that artifact and what supplies the
  # `aarch64-linux-musl-gcc` ring's build script looks for.
  linux-service:
    name: linux service (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # `make build-amd64` passes its own BUILD_TAG to cargo, so the version
      # has to be named the way the Makefile looks it up.
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Cache cargo and the native codecs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            source/.build-cache
          key: linux-service-${{ matrix.arch }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Set the Node.js version up
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Install the musl toolchain
        working-directory: source
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          # The codec scripts build through zig for musl, exactly as a
          # development machine does.
          curl -fsSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          sudo tar -xJf /tmp/zig.tar.xz -C /opt
          sudo ln -sf "/opt/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version
          # The arm64 artifact is linked by zigbuild's LLD, which is what
          # `.cargo/config.toml` expects for that target.
          command -v cargo-zigbuild >/dev/null 2>&1 ||
            cargo install --locked cargo-zigbuild
      - name: Build the service
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            if [ '${{ matrix.arch }}' = 'amd64' ]; then
              make build-amd64
            else
              make frontend-dist
              mkdir -p dist
              amrwb=$(sh scripts/build-amrwb-native.sh aarch64-unknown-linux-musl)
              evs=$(sh scripts/build-evs-native.sh aarch64-unknown-linux-musl)
              CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
              CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
              cargo zigbuild -p celmux-app --bin celmux --release --locked \
                --target aarch64-unknown-linux-musl
              install -m 0750 target/aarch64-unknown-linux-musl/release/celmux \
                dist/celmux_linux_arm64
            fi
          } 2>&1 | tee /tmp/linux-service.log
      - name: Keep the binary
        uses: actions/upload-artifact@v6
        with:
          name: linux-service-${{ matrix.arch }}
          if-no-files-found: error
          path: source/dist/celmux_linux_${{ matrix.arch }}
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -u
          for log in /tmp/*.log; do
            [ -f "$log" ] || continue
            echo "--- $log"
            tail -45 "$log"
            escaped=$(tail -45 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${log##*/}:${escaped}"
          done
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-service-${{ matrix.arch }}-logs
          if-no-files-found: ignore
          path: /tmp/*.log

  # The desktop links the host's glibc and opens X11, Wayland, GL and Vulkan
  # with dlopen, so each architecture is built on a runner of that
  # architecture. ALSA is a link-time library, hence the one build dependency.
  linux-desktop:
    name: linux desktop (${{ matrix.arch }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
      DEB_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Cache cargo and the native codecs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/.build-cache
          key: linux-desktop-${{ matrix.arch }}-${{ hashFiles('source/Cargo.lock') }}
      - name: Set the Node.js version up
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/web/package-lock.json
      - name: Install the build libraries
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # `make build-desktop` names its output `_linux_amd64` whatever host it
      # ran on, so this is that recipe with the file named for this runner.
      - name: Build the desktop client
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          {
            make frontend-dist
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh "$host")
            evs=$(sh scripts/build-evs-native.sh "$host")
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-desktop --bin celmux-desktop --release --locked
            install -m 0755 target/release/celmux-desktop \
              "dist/celmux-desktop_linux_${{ matrix.arch }}"
          } 2>&1 | tee /tmp/linux-desktop.log
      - name: Build the Debian package
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            sh packaging/desktop/linux/build-deb.sh \
              "dist/celmux-desktop_linux_${{ matrix.arch }}"
            ls -l dist/*.deb
          } 2>&1 | tee /tmp/linux-desktop-deb.log
      - name: Keep the binaries
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            source/dist/celmux-desktop_linux_${{ matrix.arch }}
            source/dist/celmux-desktop_*.deb
      - name: Report the failure
        if: failure()
        shell: bash
        run: |
          set -u
          for log in /tmp/*.log; do
            [ -f "$log" ] || continue
            echo "--- $log"
            tail -45 "$log"
            escaped=$(tail -45 "$log" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
              sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::${log##*/}:${escaped}"
          done
      - name: Keep the build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linux-desktop-${{ matrix.arch }}-logs
          if-no-files-found: ignore
          path: /tmp/*.log

  publish:
    name: publish
    needs: [plan, windows-service, windows-desktop, linux-service, linux-desktop]
    # `always()` so the tolerated Windows desktop cannot skip the release; the
    # required jobs are then checked explicitly.
    if: >-
      ${{ always() && inputs.publish == true &&
          needs.plan.result == 'success' &&
          needs['windows-service'].result == 'success' &&
          needs['linux-service'].result == 'success' &&
          needs['linux-desktop'].result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Collect the binaries
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Write the checksums
        working-directory: assets
        run: |
          set -eu
          find . -type f ! -name SHA256SUMS -printf '%P\n' | LC_ALL=C sort |
            xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
        run: |
          set -eu
          notes=$(printf '%s\n' \
            "由 anti-rainer/celmux 的 ${REF}（${REVISION}）构建。" \
            '' \
            'Linux 用 install.sh 安装，Windows 用 install.ps1 安装；' \
            '桌面端见 celmux-desktop_* 资产（Debian 包为 celmux-desktop_<版本>_<arch>.deb）；' \
            '每个资产的 SHA-256 见 SHA256SUMS。')
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --title "$TAG" --notes "$notes"
          fi

  # The report is the last thing that happens and runs whatever the build did:
  # a run that fails is exactly the one worth a message.
  notify:
    name: telegram
    needs: [plan, windows-service, windows-desktop, linux-service, linux-desktop, publish]
    if: ${{ always() && inputs.notify == true }}
    runs-on: ubuntu-22.04
    steps:
      - name: Report the run
        env:
          TGBOT_TOKEN: ${{ secrets.TGBOT_TOKEN }}
          TGBOT_CHATID: ${{ secrets.TGBOT_CHATID }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          WINDOWS_SERVICE: ${{ needs['windows-service'].result }}
          WINDOWS_DESKTOP: ${{ needs['windows-desktop'].result }}
          LINUX_SERVICE: ${{ needs['linux-service'].result }}
          LINUX_DESKTOP: ${{ needs['linux-desktop'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.version }}
        run: |
          set -eu
          if [ -z "${TGBOT_TOKEN:-}" ] || [ -z "${TGBOT_CHATID:-}" ]; then
            echo 'TGBOT_TOKEN 或 TGBOT_CHATID 未配置，跳过通知。'
            exit 0
          fi

          state() {
            case "${1:-}" in
              success) printf '成功' ;;
              failure) printf '失败' ;;
              cancelled) printf '已取消' ;;
              skipped) printf '跳过' ;;
              '') printf '未运行' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          # The Windows desktop is allowed to fail while it is being built out,
          # so it is reported but does not make the run a failure.
          failed=0
          [ "${WINDOWS_SERVICE:-}" = 'success' ] || failed=1
          [ "${LINUX_SERVICE:-}" = 'success' ] || failed=1
          [ "${LINUX_DESKTOP:-}" = 'success' ] || failed=1
          desktop_note=''
          [ "${WINDOWS_DESKTOP:-}" = 'success' ] ||
            desktop_note="（未完成，不影响发布）"
          release='未发布（产物在本次运行里）'
          if [ "${PUBLISH:-}" = 'true' ]; then
            case "${PUBLISH_RESULT:-}" in
              success) release="已发布 ${RELEASE_URL}" ;;
              skipped) release='未发布（构建未通过）' ;;
              *) release="发布失败（$(state "$PUBLISH_RESULT")）"; failed=1 ;;
            esac
          fi

          headline='celmux 构建成功'
          [ "$failed" -eq 0 ] || headline='celmux 构建失败'
          version="${VERSION:-未知}"
          [ "${PLAN_RESULT:-}" = 'success' ] || version="$version（构建准备$(state "${PLAN_RESULT:-}")）"
          message=$(printf '%s\n' \
            "$headline" \
            "版本：${version}" \
            "源码：${REF:-未知} @ ${REVISION:-未知}" \
            "构建准备：$(state "${PLAN_RESULT:-}")" \
            "服务端 Windows：$(state "${WINDOWS_SERVICE:-}")" \
            "服务端 Linux：$(state "${LINUX_SERVICE:-}")" \
            "桌面端 Windows：$(state "${WINDOWS_DESKTOP:-}")${desktop_note}" \
            "桌面端 Linux：$(state "${LINUX_DESKTOP:-}")" \
            "Release：${release}" \
            "运行：${RUN_URL}")

          curl -fsS -X POST "https://api.telegram.org/bot${TGBOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TGBOT_CHATID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true' >/dev/null
          echo '已发送 Telegram 通知'
