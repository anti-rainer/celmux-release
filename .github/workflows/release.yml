# Build the released binaries here, from the private source repository.
#
# This repository carries no source: it carries the installers and the
# releases they download. A run checks `anti-rainer/celmux` out with a personal
# access token that can read it and builds the same targets `make` builds on a
# development machine.
#
#   Actions -> release -> Run workflow
#
#   source_ref  which source branch to build: main (default), rc, beta
#   version     build version; empty continues the last release (+0.0.1)
#   notes       what the release says, used only when `publish` is checked
#   publish     create the release; unchecked keeps the binaries in the run
#   notify      report the result to Telegram
#
# `notes` is one line in the form, so a line break is written `\n` - the
# publish step turns those escapes into real newlines and the release body is
# exactly those lines: the desktop shows the body in its update panel, where a
# footer about installers is noise. Leaving `notes` empty publishes the footer
# alone instead, which says where the release came from and what installs what.
# Re-running with a tag that already exists uploads the assets over it and
# rewrites the body only when `notes` is filled in, so a curated body is never
# silently replaced.
#
# A run that does not publish still builds everything: the version gains a
# `-dev.<date>-<revision>` marker instead, so a test build cannot be mistaken
# for a release, and the binaries stay downloadable from the run itself. A run
# that publishes takes the version as it stands and makes it `releases/latest`,
# which is what both installers fetch.
#
# A release carries exactly these five assets, and each one is a job of its own,
# so a failure names the asset it belongs to:
#
#   celmux_linux_amd64           linux service, amd64      (musl, static)
#   celmux_linux_arm64           linux service, arm64      (musl, static)
#   celmux_win_amd64.exe         windows service, amd64    (mingw cross)
#   celmux_linux_amd64_desktop.deb  linux desktop, amd64   (glibc, native)
#   celmux_win_amd64_desktop.exe    windows desktop, amd64 (unfinished)
#
# A release also carries SHA256SUMS.txt, generated from the assets it is about
# to publish. The Windows installer verifies the service executable against it
# (falling back to the digest GitHub records for the asset) before running
# anything, and the file is what an operator can check the desktop installer
# with by hand. It is the free half of integrity: it proves the download is the
# bytes this release published. It is not an Authenticode signature, so Windows
# still reports an unknown publisher - a trusted one needs a certificate the
# project does not have.
#
# The installers fetch `celmux_linux_<arch>` and `celmux_win_amd64.exe`, and the
# service's own updater matches those names, so none of them may drift. Only
# these five ever reach the release: a job that fails keeps its build logs as an
# artifact, and the publish step picks the assets by name so a log can never
# travel as one.
#
# The desktop links the host's glibc and opens X11, Wayland, GL and Vulkan with
# dlopen, so it builds on a runner of its own architecture (amd64 on 22.04,
# glibc 2.35). The service is static, so both of its architectures cross-build
# on x86. The Windows half needs a mingw-w64 whose GCC knows
# `-mdirect-extern-access` (GCC 12+), which is why those jobs are on 24.04
# rather than 22.04.
#
# The Vue bundle is part of the service's binary, so it is built once by the
# `frontend` job and handed to the three service jobs as an artifact. The
# desktop does not embed it at all (`celmux-app` is compiled without its `web`
# feature), so those two jobs skip it and their Node.js setup entirely.
#
# The Windows desktop is still being built out: its job may fail without
# failing the run, and a release then simply carries the other four assets.
#
# Secrets: `celmux_pat` reads the private source; `TGBOT_TOKEN` and
# `TGBOT_CHATID` are the notifier's bot. All three are repository secrets
# (Settings -> Secrets and variables -> Actions), so every job can read them
# and no job has to declare an environment.

name: release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支'
        type: choice
        options:
          - main
          - rc
          - beta
        default: main
      version:
        description: '构建版本号（留空 = 上一个 release + 0.0.1）'
        type: string
        default: ''
      notes:
        description: '更新内容（勾选发布 release 时写入；`\n` 表示换行，留空只写自动说明）'
        type: string
        default: ''
      publish:
        description: '发布 release'
        type: boolean
        default: false
      notify:
        description: '发送 Telegram 通知'
        type: boolean
        default: true

permissions:
  contents: write

# One release at a time: two runs would write into the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pick.outputs.version }}
      revision: ${{ steps.pick.outputs.revision }}
    steps:
      # This repository first: it is the workspace root, and the source
      # checkout lands in `source/` below it. Checking out the root afterwards
      # would run `git clean` over the workspace and delete that directory.
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      # Checked before anything else, because `actions/checkout` reports a
      # token that cannot read the private source as a plain clone failure.
      - name: Check what the token can read
        env:
          PAT: ${{ secrets.CELMUX_PAT }}
        run: |
          set -eu
          if [ -z "${PAT:-}" ]; then
            echo '::error::仓库密钥 celmux_pat 没有配置（Settings -> Secrets and variables -> Actions -> New repository secret）'
            exit 1
          fi
          # 令牌本身从不打印，但形状（类型、长度、有没有带空白）足以看出粘贴错误。
          trimmed=$(printf '%s' "$PAT" | tr -d '[:space:]')
          case "$PAT" in
            github_pat_*) kind='fine-grained' ;;
            ghp_*) kind='classic' ;;
            *) kind='未知（不以 github_pat_ / ghp_ 开头）' ;;
          esac
          if [ "$PAT" = "$trimmed" ]; then
            blanks='没有'
          else
            blanks='有（密钥里带了空格或换行，需要重新粘贴）'
          fi
          echo "celmux_pat：类型 ${kind}，长度 ${#PAT}，首尾空白 ${blanks}"
          who=$(curl -s -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user |
            python3 -c 'import json,sys;print(json.load(sys.stdin).get("login","未知"))')
          scopes=$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${PAT}" \
            https://api.github.com/user | tr -d '\r' |
            sed -n 's/^x-oauth-scopes: //p')
          echo "celmux_pat 属于账号 ${who}；scopes: ${scopes:-（无，fine-grained 令牌没有这个头）}"
          code=$(curl -s -o /tmp/source.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/anti-rainer/celmux)
          case "$code" in
            200)
              echo 'celmux_pat 可以读取 anti-rainer/celmux，继续。'
              ;;
            404)
              echo '::error::celmux_pat 读 anti-rainer/celmux 得到 404：令牌没有包含这个私有仓库。fine-grained 令牌要在 Repository access 里选中 anti-rainer/celmux 并给 Contents: Read；classic 令牌要有 repo 范围。'
              exit 1
              ;;
            401)
              echo '::error::celmux_pat 无效或已过期（HTTP 401）。'
              exit 1
              ;;
            *)
              echo "::error::celmux_pat 读 anti-rainer/celmux 失败（HTTP ${code}）：$(cat /tmp/source.json)"
              exit 1
              ;;
          esac
      - name: Check the source out
        uses: actions/checkout@v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          # The clone happens with the token; nothing later needs it, so it is
          # not left in the checkout for the build to read.
          persist-credentials: false
          path: source
          fetch-depth: 0
      # The Windows packaging scripts are developed in the source repository
      # and downloaded by users from this one. A copy that drifted apart sends
      # an old installer to everyone, so the two are compared and the diff is
      # reported; it is a warning rather than a gate because the file users
      # actually download is this repository's copy, which is the one to fix.
      - name: Check the installer copies are current
        run: |
          set -eu
          drifted=''
          for file in install.ps1 install-qmi-binding.ps1 uninstall-qmi-binding.ps1 \
                      install-driver.bat celmux-qmi.inf; do
            if ! cmp -s "source/packaging/desktop/windows/$file" "$file"; then
              drifted="$drifted $file"
              echo "--- $file"
              diff -u "$file" "source/packaging/desktop/windows/$file" | head -40 || true
            fi
          done
          if [ -n "$drifted" ]; then
            echo "::warning::本仓库里的 Windows 安装脚本与源码分支不一致：${drifted}。用户下载的是本仓库的副本，如果这次发布要带上源码分支里的改动，先把文件同步过来（cp source/packaging/desktop/windows/<文件> . ）再推送。"
          else
            echo 'Windows 安装脚本与源码分支一致。'
          fi
      - name: Name the build
        id: pick
        shell: bash
        working-directory: source
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          revision=$(git rev-parse --short HEAD)
          describe=$(git describe --tags --always)

          # 0.0.1 for a version that carries no `X.Y.Z`, and the next patch for
          # every other shape the tags have taken (`1.0.3`, `1.0.3-fix2`,
          # `1.0.3-fix2-31-g4ebac6c`).
          next_version() {
            set -- $(printf '%s' "${1:-}" |
              sed -n 's/^[vV]*\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2 \3/p')
            if [ "$#" -ne 3 ]; then
              printf '0.0.1\n'
              return 0
            fi
            printf '%s.%s.%s\n' "$1" "$2" "$(( $3 + 1 ))"
          }

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq '.tagName' 2>/dev/null || true)
            [ -n "$previous" ] || previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
            echo "上一个版本：${previous:-无}"
            version=$(next_version "$previous")
          fi
          if [ "$PUBLISH" != 'true' ]; then
            version="$version-dev.$(date -u +%Y%m%d)-$revision"
          fi

          echo "构建版本 $version（$describe @ $revision）"
          {
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  # The Vue bundle is embedded in the service binary and is identical for every
  # service asset, so it is built (and linted, type-checked) exactly once here
  # instead of five times. A front end that does not build fails the run before
  # any asset job starts.
  frontend:
    name: frontend
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-frontend
      - name: Build the web assets
        working-directory: source
        run: make frontend-dist
      - name: Keep the web assets
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          if-no-files-found: error
          path: source/web/dist
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-frontend

  # ---------------------------------------------------------------- assets
  # Each job builds exactly one asset, named the way the release needs it.

  linux-amd64:
    name: celmux_linux_amd64
    needs: [plan, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # `make build-amd64` passes its own BUILD_TAG to cargo, so the version
      # has to be named the way the Makefile looks it up.
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-amd64
      - name: Take the web assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the musl toolchain
        uses: ./.github/actions/zigbuild-toolchain
        with:
          target: x86_64-unknown-linux-musl
      # Both architectures go through zigbuild. The musl target links
      # `-static-pie`, and the AMR-WB wrapper object that cc-rs compiles is not
      # position independent when it goes through a musl gcc, which is what a
      # plain `cargo build` here ends up doing: the link then fails with
      # `relocation R_X86_64_32S ... can not be used when making a PIE object`.
      # zigbuild supplies a compiler that produces PIC objects and links with
      # its own LLD, which is also how the arm64 asset is built.
      - name: Build celmux_linux_amd64
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-unknown-linux-musl)
            evs=$(sh scripts/build-evs-native.sh x86_64-unknown-linux-musl)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo zigbuild -p celmux-app --bin celmux --release --locked \
              --target x86_64-unknown-linux-musl
            install -m 0750 target/x86_64-unknown-linux-musl/release/celmux \
              dist/celmux_linux_amd64
          } 2>&1 | tee /tmp/celmux_linux_amd64.log
      - name: Keep the asset
        uses: actions/upload-artifact@v6
        with:
          name: celmux_linux_amd64
          if-no-files-found: error
          path: source/dist/celmux_linux_amd64
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-amd64

  linux-arm64:
    name: celmux_linux_arm64
    needs: [plan, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-arm64
      - name: Take the web assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the musl toolchain
        uses: ./.github/actions/zigbuild-toolchain
        with:
          target: aarch64-unknown-linux-musl
      # `make build-arm64` expects a compiler for the target to be in the
      # environment already; this is the Makefile's own recipe with cargo
      # zigbuild in place of cargo build.
      - name: Build celmux_linux_arm64
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh aarch64-unknown-linux-musl)
            evs=$(sh scripts/build-evs-native.sh aarch64-unknown-linux-musl)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo zigbuild -p celmux-app --bin celmux --release --locked \
              --target aarch64-unknown-linux-musl
            install -m 0750 target/aarch64-unknown-linux-musl/release/celmux \
              dist/celmux_linux_arm64
          } 2>&1 | tee /tmp/celmux_linux_arm64.log
      - name: Keep the asset
        uses: actions/upload-artifact@v6
        with:
          name: celmux_linux_arm64
          if-no-files-found: error
          path: source/dist/celmux_linux_arm64
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-arm64

  win-amd64:
    name: celmux_win_amd64.exe
    needs: [plan, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-win-amd64
      - name: Take the web assets
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the cross toolchain
        uses: ./.github/actions/mingw-toolchain
      - name: Build celmux_win_amd64.exe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
            evs=$(sh scripts/build-evs-native.sh x86_64-pc-windows-gnu)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-app --bin celmux --release --locked \
              --target x86_64-pc-windows-gnu
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux.exe \
              dist/celmux_win_amd64.exe
          } 2>&1 | tee /tmp/celmux_win_amd64.exe.log
      - name: Keep the asset
        uses: actions/upload-artifact@v6
        with:
          name: celmux_win_amd64.exe
          if-no-files-found: error
          path: source/dist/celmux_win_amd64.exe
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-win-amd64

  linux-amd64-desktop:
    name: celmux_linux_amd64_desktop.deb
    needs: plan
    # The desktop links the host's glibc, so it is built on the runner the
    # package is for: 22.04, glibc 2.35.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
      DEB_ARCH: amd64
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-amd64-desktop
      - name: Install the build libraries
        run: |
          set -eux
          sudo apt-get update
          # The window opens X11, Wayland, GL and Vulkan with dlopen, so those
          # need no headers; ALSA is linked, so it does.
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      # `make build-desktop` names its output `_linux_amd64` whatever host it
      # ran on, so this is that recipe with the release's name on the file. The
      # client does not embed the Vue bundle, so no web assets are built here.
      - name: Build celmux_linux_amd64_desktop.deb
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh "$host")
            evs=$(sh scripts/build-evs-native.sh "$host")
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-desktop --bin celmux-desktop --release --locked
            install -m 0755 target/release/celmux-desktop \
              dist/celmux-desktop_linux_amd64
            sh packaging/desktop/linux/build-deb.sh dist/celmux-desktop_linux_amd64
            # One fixed asset name; the version stays inside the package.
            install -m 0644 dist/celmux-desktop_*.deb \
              dist/celmux_linux_amd64_desktop.deb
          } 2>&1 | tee /tmp/celmux_linux_amd64_desktop.deb.log
      - name: Keep the asset
        uses: actions/upload-artifact@v6
        with:
          name: celmux_linux_amd64_desktop.deb
          if-no-files-found: error
          path: source/dist/celmux_linux_amd64_desktop.deb
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-amd64-desktop

  # The client is still being built out on Windows: the job runs and its asset
  # joins the release when it compiles, and nothing else waits for it.
  win-amd64-desktop:
    name: celmux_win_amd64_desktop.exe
    needs: plan
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 180
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-win-amd64-desktop
      - name: Install the cross toolchain
        uses: ./.github/actions/mingw-toolchain
      - name: Build celmux_win_amd64_desktop.exe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
            evs=$(sh scripts/build-evs-native.sh x86_64-pc-windows-gnu)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-desktop --bin celmux-desktop --release --locked \
              --target x86_64-pc-windows-gnu
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux-desktop.exe \
              dist/celmux-desktop_win_amd64.exe
            # The asset is the installer, and the client travels inside it.
            CELMUX_SETUP_PAYLOAD="$PWD/dist/celmux-desktop_win_amd64.exe" \
            cargo build -p celmux-setup --bin celmux-setup --release --locked \
              --target x86_64-pc-windows-gnu --features embed
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux-setup.exe \
              dist/celmux_win_amd64_desktop.exe
          } 2>&1 | tee /tmp/celmux_win_amd64_desktop.exe.log
      - name: Keep the asset
        uses: actions/upload-artifact@v6
        with:
          name: celmux_win_amd64_desktop.exe
          if-no-files-found: warn
          path: source/dist/celmux_win_amd64_desktop.exe
      - name: Report the failure
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-win-amd64-desktop
          severity: warning
          prefix: 'Windows 桌面端没有编出来（不影响本次发布）：'

  publish:
    name: publish
    needs: [plan, linux-amd64, linux-arm64, win-amd64, linux-amd64-desktop, win-amd64-desktop]
    # `always()` so the tolerated Windows desktop cannot skip the release; the
    # finished assets are then checked explicitly.
    if: >-
      ${{ always() && inputs.publish == true &&
          needs.plan.result == 'success' &&
          needs['linux-amd64'].result == 'success' &&
          needs['linux-arm64'].result == 'success' &&
          needs['win-amd64'].result == 'success' &&
          needs['linux-amd64-desktop'].result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Collect the assets
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh release` needs to know which repository it is talking to, and
          # this job never checks the repository out: the assets it publishes
          # are the ones the build jobs uploaded, and checking out here would
          # only `git clean` the directory they were just downloaded into.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          ls -l assets

          # The five names a release may carry, and the four an installer or an
          # updater needs. A tolerated job that failed left its build logs as an
          # artifact next to these, so the list is explicit: `assets/*` would
          # publish those logs with the release.
          assets=()
          for name in celmux_linux_amd64 celmux_linux_arm64 celmux_win_amd64.exe \
                      celmux_linux_amd64_desktop.deb celmux_win_amd64_desktop.exe; do
            if [ -f "assets/$name" ]; then
              assets+=("assets/$name")
            fi
          done
          for name in celmux_linux_amd64 celmux_linux_arm64 celmux_win_amd64.exe \
                      celmux_linux_amd64_desktop.deb; do
            if [ ! -f "assets/$name" ]; then
              echo "::error::缺少资产 ${name}"
              exit 1
            fi
          done
          printf '本次发布的资产：\n'
          printf '  %s\n' "${assets[@]}"

          # Every installer and every operator checks the download against
          # this file, so it is generated from the assets that are about to be
          # published, not from a build directory that may still hold an older
          # run's output.
          ( cd assets && sha256sum "${assets[@]##*/}" > SHA256SUMS.txt )
          echo '--- SHA256SUMS.txt'
          cat assets/SHA256SUMS.txt

          # What a release with no notes of its own says: where it came from
          # and which asset installs what. A release that was given notes
          # publishes exactly those - the client shows the body in its update
          # panel, where a footer about installers is noise.
          footer=$(printf '%s\n' \
            "由 anti-rainer/celmux 的 ${REF}（${REVISION}）构建。" \
            '' \
            'Linux 服务端用 install.sh 安装，Windows 服务端用 install.ps1 安装；' \
            'Linux 桌面端是 celmux_linux_amd64_desktop.deb，Windows 桌面端是' \
            'celmux_win_amd64_desktop.exe（未完成时该资产可能缺席）。')
          if [ -n "${NOTES:-}" ]; then
            # The dispatch form is one line; `\n` in it is what gives the
            # release a body with one change per line.
            notes=$(printf '%b\n' "$NOTES")
          else
            notes=$footer
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" assets/SHA256SUMS.txt --clobber
            # Only a filled-in body replaces one: re-uploading an asset must
            # not overwrite notes somebody edited in the web interface.
            if [ -n "${NOTES:-}" ]; then
              printf '%s' "$notes" | gh release edit "$TAG" --notes-file -
            fi
          else
            printf '%s' "$notes" | gh release create "$TAG" "${assets[@]}" \
              assets/SHA256SUMS.txt --title "$TAG" --notes-file -
          fi

  # The report is the last thing that happens and runs whatever the build did:
  # a run that fails is exactly the one worth a message.
  notify:
    name: telegram
    needs: [plan, linux-amd64, linux-arm64, win-amd64, linux-amd64-desktop, win-amd64-desktop, publish]
    if: ${{ always() && inputs.notify == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report the run
        env:
          TGBOT_TOKEN: ${{ secrets.TGBOT_TOKEN }}
          TGBOT_CHATID: ${{ secrets.TGBOT_CHATID }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          LINUX_AMD64: ${{ needs['linux-amd64'].result }}
          LINUX_ARM64: ${{ needs['linux-arm64'].result }}
          WIN_AMD64: ${{ needs['win-amd64'].result }}
          LINUX_DESKTOP: ${{ needs['linux-amd64-desktop'].result }}
          WIN_DESKTOP: ${{ needs['win-amd64-desktop'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.version }}
        run: |
          set -eu
          if [ -z "${TGBOT_TOKEN:-}" ] || [ -z "${TGBOT_CHATID:-}" ]; then
            echo 'TGBOT_TOKEN 或 TGBOT_CHATID 未配置，跳过通知。'
            exit 0
          fi

          state() {
            case "${1:-}" in
              success) printf '成功' ;;
              failure) printf '失败' ;;
              cancelled) printf '已取消' ;;
              skipped) printf '跳过' ;;
              '') printf '未运行' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          # The Windows desktop is allowed to fail while it is being built out,
          # so it is reported but does not make the run a failure.
          failed=0
          for result in "${LINUX_AMD64:-}" "${LINUX_ARM64:-}" "${WIN_AMD64:-}" \
                        "${LINUX_DESKTOP:-}"; do
            [ "$result" = 'success' ] || failed=1
          done
          desktop_note=''
          [ "${WIN_DESKTOP:-}" != 'failure' ] ||
            desktop_note='（未完成，不影响发布）'
          release='未发布（产物在本次运行里）'
          if [ "${PUBLISH:-}" = 'true' ]; then
            case "${PUBLISH_RESULT:-}" in
              success) release="已发布 ${RELEASE_URL}" ;;
              skipped) release='未发布（构建未通过）' ;;
              *) release="发布失败（$(state "$PUBLISH_RESULT")）"; failed=1 ;;
            esac
          fi

          headline='celmux 构建成功'
          [ "$failed" -eq 0 ] || headline='celmux 构建失败'
          version="${VERSION:-未知}"
          [ "${PLAN_RESULT:-}" = 'success' ] || version="$version（构建准备$(state "${PLAN_RESULT:-}")）"
          message=$(printf '%s\n' \
            "$headline" \
            "版本：${version}" \
            "源码：${REF:-未知} @ ${REVISION:-未知}" \
            "构建准备：$(state "${PLAN_RESULT:-}")" \
            "celmux_linux_amd64：$(state "${LINUX_AMD64:-}")" \
            "celmux_linux_arm64：$(state "${LINUX_ARM64:-}")" \
            "celmux_win_amd64.exe：$(state "${WIN_AMD64:-}")" \
            "celmux_linux_amd64_desktop.deb：$(state "${LINUX_DESKTOP:-}")" \
            "celmux_win_amd64_desktop.exe：$(state "${WIN_DESKTOP:-}")${desktop_note}" \
            "Release：${release}" \
            "运行：${RUN_URL}")

          curl -fsS -X POST "https://api.telegram.org/bot${TGBOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TGBOT_CHATID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true' >/dev/null
          echo '已发送 Telegram 通知'
