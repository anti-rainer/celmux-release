# Build the released binaries here, from the private source repository.
#
# This repository carries no source: it carries the installers and the
# releases they download. A run checks `anti-rainer/celmux` out with a personal
# access token that can read it and builds the same targets `make` builds on a
# development machine.
#
#   Actions -> release -> Run workflow
#
#   source_ref  which source branch to build: main (default), rc, beta
#   version     build version; empty continues the last release (+0.0.1)
#   notes       what the release says, used only when `publish` is checked
#   publish     create the release; unchecked keeps the binaries in the run
#   notify      report the result to Telegram
#
# `notes` is one line in the form, so a line break is written `\n` - the
# publish step turns those escapes into real newlines and the release body is
# exactly those lines: the desktop shows the body in its update panel, where a
# footer about installers is noise. Leaving `notes` empty publishes the footer
# alone instead, which says where the release came from and what installs what.
# Re-running with a tag that already exists uploads the assets over it and
# rewrites the body only when `notes` is filled in, so a curated body is never
# silently replaced.
#
# A run that does not publish still builds everything: the version gains a
# `-dev.<date>-<revision>` marker instead, so a test build cannot be mistaken
# for a release, and the binaries stay downloadable from the run itself. A run
# that publishes takes the version as it stands and makes it `releases/latest`,
# which is what both installers fetch.
#
# A release carries these five assets, and each one is a job of its own,
# so a failure names the asset it belongs to:
#
#   celmux_linux_amd64           linux service, amd64      (musl, static)
#   celmux_linux_arm64           linux service, arm64      (musl, static)
#   celmux_win_amd64.exe         windows service, amd64    (mingw cross)
#   celmux_linux_amd64_desktop.deb  linux Qt desktop, amd64 (glibc, native)
#   celmux_win_amd64_desktop.exe    Windows Qt desktop installer (MSVC shell/GNU host)
#
# A release also carries SHA256SUMS.txt, generated from the assets it is about
# to publish. The Windows installer verifies the service executable against it
# (falling back to the digest GitHub records for the asset) before running
# anything, and the file is what an operator can check the desktop installer
# with by hand. It is the free half of integrity: it proves the download is the
# bytes this release published. It is not an Authenticode signature, so Windows
# still reports an unknown publisher - a trusted one needs a certificate the
# project does not have.
#
# The installers fetch `celmux_linux_<arch>` and `celmux_win_amd64.exe`, and the
# service's own updater matches those names, so none of them may drift. Only
# these five ever reach the release: a job that fails keeps its build logs as an
# artifact, and the publish step picks the assets by name so a log can never
# travel as one.
#
# The Linux desktop bundles the matching Qt runtime and links the host's glibc,
# so it builds on an amd64 24.04 runner (glibc 2.39). The service is static, so
# both of its architectures cross-build on x86. The Windows backend needs a
# mingw-w64 whose GCC knows
# `-mdirect-extern-access` (GCC 12+), which is why those jobs are on 24.04
# rather than 22.04.
#
# The Vue bundle is part of the service's binary, so it is built once by the
# `frontend` job and handed to the three service jobs as an artifact. The
# desktop does not embed it at all (`celmux-app` is compiled without its `web`
# feature), so those two jobs skip it and their Node.js setup entirely.
#
# The Windows desktop is always built: a Windows runner builds the MSVC Qt
# shell and packages the separate GNU runtime host. The ZIP includes per-user
# installation scripts; in-app automatic installation remains disabled.
#
# Secrets: `celmux_pat` reads the private source; `TGBOT_TOKEN` and
# `TGBOT_CHATID` are the notifier's bot. All three are repository secrets
# (Settings -> Secrets and variables -> Actions), so every job can read them
# and no job has to declare an environment.

name: release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '源码分支'
        type: choice
        options:
          - main
          - rc
          - beta
        default: main
      version:
        description: '构建版本号（留空 = 上一个 release + 0.0.1）'
        type: string
        default: ''
      notes:
        description: '更新内容（勾选发布 release 时写入；`\n` 表示换行，留空只写自动说明）'
        type: string
        default: ''
      publish:
        description: '发布 release'
        type: boolean
        default: false
      notify:
        description: '发送 Telegram 通知'
        type: boolean
        default: true

permissions:
  contents: read

# One release at a time: two runs would write into the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.pick.outputs.version }}
      revision: ${{ steps.pick.outputs.revision }}
    steps:
      # This repository first: it is the workspace root, and the source
      # checkout lands in `source/` below it. Checking out the root afterwards
      # would run `git clean` over the workspace and delete that directory.
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Checked before anything else, because `actions/checkout` reports a
      # token that cannot read the private source as a plain clone failure.
      - name: Check what the token can read
        env:
          PAT: ${{ secrets.CELMUX_PAT }}
        run: |
          set -eu
          if [ -z "${PAT:-}" ]; then
            echo '::error::仓库密钥 celmux_pat 没有配置（Settings -> Secrets and variables -> Actions -> New repository secret）'
            exit 1
          fi
          # 令牌本身从不打印，但形状（类型、长度、有没有带空白）足以看出粘贴错误。
          trimmed=$(printf '%s' "$PAT" | tr -d '[:space:]')
          case "$PAT" in
            github_pat_*) kind='fine-grained' ;;
            ghp_*) kind='classic' ;;
            *) kind='未知（不以 github_pat_ / ghp_ 开头）' ;;
          esac
          if [ "$PAT" = "$trimmed" ]; then
            blanks='没有'
          else
            blanks='有（密钥里带了空格或换行，需要重新粘贴）'
          fi
          echo "celmux_pat：类型 ${kind}，长度 ${#PAT}，首尾空白 ${blanks}"
          who=$(curl -s -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/user |
            python3 -c 'import json,sys;print(json.load(sys.stdin).get("login","未知"))')
          scopes=$(curl -s -D - -o /dev/null -H "Authorization: Bearer ${PAT}" \
            https://api.github.com/user | tr -d '\r' |
            sed -n 's/^x-oauth-scopes: //p')
          echo "celmux_pat 属于账号 ${who}；scopes: ${scopes:-（无，fine-grained 令牌没有这个头）}"
          code=$(curl -s -o /tmp/source.json -w '%{http_code}' \
            -H "Authorization: Bearer ${PAT}" \
            -H 'Accept: application/vnd.github+json' \
            https://api.github.com/repos/anti-rainer/celmux)
          case "$code" in
            200)
              echo 'celmux_pat 可以读取 anti-rainer/celmux，继续。'
              ;;
            404)
              echo '::error::celmux_pat 读 anti-rainer/celmux 得到 404：令牌没有包含这个私有仓库。fine-grained 令牌要在 Repository access 里选中 anti-rainer/celmux 并给 Contents: Read；classic 令牌要有 repo 范围。'
              exit 1
              ;;
            401)
              echo '::error::celmux_pat 无效或已过期（HTTP 401）。'
              exit 1
              ;;
            *)
              echo "::error::celmux_pat 读 anti-rainer/celmux 失败（HTTP ${code}）：$(cat /tmp/source.json)"
              exit 1
              ;;
          esac
      - name: Check the source out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          # The clone happens with the token; nothing later needs it, so it is
          # not left in the checkout for the build to read.
          persist-credentials: false
          path: source
          fetch-depth: 0
      # The Windows packaging scripts are developed in the source repository
      # and downloaded by users from this one. A copy that drifted apart sends
      # an old installer to everyone, so the two are compared and the diff is
      # reported; it is a warning rather than a gate because the file users
      # actually download is this repository's copy, which is the one to fix.
      - name: Check the installer copies are current
        run: |
          set -eu
          drifted=''
          for file in install.ps1 install-qmi-binding.ps1 uninstall-qmi-binding.ps1 \
                      install-driver.bat celmux-qmi.inf; do
            if ! cmp -s "source/packaging/desktop/windows/$file" "$file"; then
              drifted="$drifted $file"
              echo "--- $file"
              diff -u "$file" "source/packaging/desktop/windows/$file" | head -40 || true
            fi
          done
          if [ -n "$drifted" ]; then
            echo "::warning::本仓库里的 Windows 安装脚本与源码分支不一致：${drifted}。用户下载的是本仓库的副本，如果这次发布要带上源码分支里的改动，先把文件同步过来（cp source/packaging/desktop/windows/<文件> . ）再推送。"
          else
            echo 'Windows 安装脚本与源码分支一致。'
          fi
      - name: Name the build
        id: pick
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -eu
          revision=$(git rev-parse --short HEAD)
          describe=$(git describe --tags --always)

          # 0.0.1 for a version that carries no `X.Y.Z`, and the next patch for
          # every other shape the tags have taken (`1.0.3`, `1.0.3-fix2`,
          # `1.0.3-fix2-31-g4ebac6c`).
          next_version() {
            set -- $(printf '%s' "${1:-}" |
              sed -n 's/^[vV]*\([0-9][0-9]*\)\.\([0-9][0-9]*\)\.\([0-9][0-9]*\).*/\1 \2 \3/p')
            if [ "$#" -ne 3 ]; then
              printf '0.0.1\n'
              return 0
            fi
            printf '%s.%s.%s\n' "$1" "$2" "$(( $3 + 1 ))"
          }

          version="$REQUESTED_VERSION"
          if [ -z "$version" ]; then
            previous=$(gh release view --repo "$GITHUB_REPOSITORY" \
              --json tagName --jq '.tagName' 2>/dev/null || true)
            [ -n "$previous" ] || previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
            echo "上一个版本：${previous:-无}"
            version=$(next_version "$previous")
          fi
          if [ "$PUBLISH" != 'true' ]; then
            version="$version-dev.$(date -u +%Y%m%d)-$revision"
          fi

          echo "构建版本 $version（$describe @ $revision）"
          {
            echo "version=$version"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

  # The Vue bundle is embedded in the service binary and is identical for every
  # service asset, so it is built (and linted, type-checked) exactly once here
  # instead of once per service. A front end that does not build fails the run before
  # any asset job starts.
  frontend:
    name: frontend
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-frontend
      - name: Build the web assets
        working-directory: source
        run: make frontend-dist
      - name: Keep the web assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-dist
          if-no-files-found: error
          path: source/web/dist
      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-frontend

  checks:
    name: checks
    needs: [plan, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-checks
      - name: Take the web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Format, lint, test and count
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked
          cargo test --workspace --locked
          sh scripts/check-test-budget.sh

  # ---------------------------------------------------------------- assets
  # Each job builds exactly one asset, named the way the release needs it.

  linux-amd64:
    name: celmux_linux_amd64
    needs: [plan, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      # `make build-amd64` passes its own BUILD_TAG to cargo, so the version
      # has to be named the way the Makefile looks it up.
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-amd64
      - name: Take the web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the musl toolchain
        uses: ./.github/actions/zigbuild-toolchain
        with:
          target: x86_64-unknown-linux-musl
      # Both architectures go through zigbuild. The musl target links
      # `-static-pie`, and the AMR-WB wrapper object that cc-rs compiles is not
      # position independent when it goes through a musl gcc, which is what a
      # plain `cargo build` here ends up doing: the link then fails with
      # `relocation R_X86_64_32S ... can not be used when making a PIE object`.
      # zigbuild supplies a compiler that produces PIC objects and links with
      # its own LLD, which is also how the arm64 asset is built.
      - name: Build celmux_linux_amd64
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-unknown-linux-musl)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            cargo zigbuild -p celmux-app --bin celmux --release --locked \
              --target x86_64-unknown-linux-musl
            install -m 0750 target/x86_64-unknown-linux-musl/release/celmux \
              dist/celmux_linux_amd64
          } 2>&1 | tee /tmp/celmux_linux_amd64.log
      - name: Keep the asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux_linux_amd64
          if-no-files-found: error
          path: source/dist/celmux_linux_amd64
      - name: Smoke the service binary
        working-directory: source
        shell: bash
        run: |
          set -eux
          test -s dist/celmux_linux_amd64
          ./dist/celmux_linux_amd64 --version | tee /tmp/celmux-version.txt
          grep -F "${{ needs.plan.outputs.version }}" /tmp/celmux-version.txt
      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-amd64

  linux-arm64:
    name: celmux_linux_arm64
    needs: [plan, frontend]
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-arm64
      - name: Take the web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the musl toolchain
        uses: ./.github/actions/zigbuild-toolchain
        with:
          target: aarch64-unknown-linux-musl
      # `make build-arm64` expects a compiler for the target to be in the
      # environment already; this is the Makefile's own recipe with cargo
      # zigbuild in place of cargo build.
      - name: Build celmux_linux_arm64
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh aarch64-unknown-linux-musl)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            cargo zigbuild -p celmux-app --bin celmux --release --locked \
              --target aarch64-unknown-linux-musl
            install -m 0750 target/aarch64-unknown-linux-musl/release/celmux \
              dist/celmux_linux_arm64
          } 2>&1 | tee /tmp/celmux_linux_arm64.log
      - name: Keep the asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux_linux_arm64
          if-no-files-found: error
          path: source/dist/celmux_linux_arm64
      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-arm64

  win-amd64:
    name: celmux_win_amd64.exe
    needs: [plan, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-win-amd64
      - name: Take the web assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: source/web/dist
      - name: Install the cross toolchain
        uses: ./.github/actions/mingw-toolchain
      - name: Build celmux_win_amd64.exe
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            cargo build -p celmux-app --bin celmux --release --locked \
              --target x86_64-pc-windows-gnu
            install -m 0755 target/x86_64-pc-windows-gnu/release/celmux.exe \
              dist/celmux_win_amd64.exe
          } 2>&1 | tee /tmp/celmux_win_amd64.exe.log
      - name: Keep the asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux_win_amd64.exe
          if-no-files-found: error
          path: source/dist/celmux_win_amd64.exe
      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-win-amd64

  linux-amd64-desktop:
    name: celmux_linux_amd64_desktop.deb
    needs: plan
    # Qt 6.12 is deployed with the matching Ubuntu 24.04 host ABI.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_TAG: ${{ needs.plan.outputs.version }}
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
      DEB_ARCH: amd64
    steps:
      - name: Check this workflow's repository out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-linux-amd64-desktop
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Qt build dependencies and SDK
        working-directory: source
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ lld dpkg-dev xvfb xauth openbox libasound2-dev pkg-config libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libxcb-randr0 libxcb-shm0 libxcb-xinerama0 libxcb-glx0 libxkbcommon-x11-0 libegl1 libvulkan1 libdbus-1-3 libfontconfig1 libwayland-client0 libwayland-cursor0 libwayland-egl1 libgtk-3-0t64 libjpeg-turbo8 libtiff6 libwebp7 libwebpdemux2 libwebpmux3 libicu74 libmd4c0
          python -m pip install aqtinstall==3.3.0
          LD_LIBRARY_PATH="$RUNNER_TEMP/Qt/6.12.0/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" python scripts/install-qt-sdk.py install-qt linux desktop 6.12.0 linux_gcc_64 -O "$RUNNER_TEMP/Qt" --archives qtbase qtdeclarative qtsvg qttools qttranslations qtwayland icu
          "$RUNNER_TEMP/Qt/6.12.0/gcc_64/bin/qmake" -query QT_VERSION
          python scripts/collect-qt-licenses.py 6.12.0 "$RUNNER_TEMP/Qt/6.12.0/Licenses"
          echo "QMAKE=$RUNNER_TEMP/Qt/6.12.0/gcc_64/bin/qmake" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/6.12.0/gcc_64/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/Qt/6.12.0/gcc_64/bin" >> "$GITHUB_PATH"
      - name: Build celmux_linux_amd64_desktop.deb
        working-directory: source
        shell: bash
        env:
          RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          {
            mkdir -p dist
            amrwb=$(sh scripts/build-amrwb-native.sh "$host")
            evs=$(sh scripts/build-evs-native.sh "$host")
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            cargo build -p celmux-desktop-runtime --bin celmux-desktop-host --release --locked
            CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
            CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
            QMAKE="$QMAKE" QT_VERSION_MAJOR=6 \
            cargo build -p celmux-desktop-qt --bin celmux-desktop-qt --features qt --release --locked
            QMAKE="$QMAKE" VERSION="$CELMUX_BUILD_TAG" \
            sh packaging/desktop/qt/build-deb.sh \
              target/release/celmux-desktop-qt target/release/celmux-desktop-host
            # One fixed asset name; the version stays inside the package.
            install -m 0644 dist/celmux-desktop_*.deb \
              dist/celmux_linux_amd64_desktop.deb
          } 2>&1 | tee /tmp/celmux_linux_amd64_desktop.deb.log
      - name: Verify the deployed Linux Qt package
        working-directory: source
        run: |
          set -euo pipefail
          mkdir -p dist/qt-desktop-validation
          dpkg-deb -x dist/celmux_linux_amd64_desktop.deb dist/qt-desktop-validation
          runtime="$PWD/dist/qt-desktop-validation/opt/celmux-desktop"
          "$runtime/celmux-desktop-host" --ipc-smoke-test
          for case in normal empty partial; do
            LD_LIBRARY_PATH="$runtime/lib" QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1280x900x24' "$runtime/celmux-desktop-qt" --window-command-smoke-test --fixture-case "$case"
            LD_LIBRARY_PATH="$runtime/lib" QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1280x900x24' "$runtime/celmux-desktop-qt" --device-ui-smoke-test --fixture-case "$case" >"dist/device-$case.json" 2>"dist/device-$case.stderr" || { cat "dist/device-$case.json" "dist/device-$case.stderr"; exit 1; }
            cat "dist/device-$case.json" "dist/device-$case.stderr"
          done
          LD_LIBRARY_PATH="$runtime/lib" QT_QPA_PLATFORM=xcb xvfb-run -a -s '-screen 0 1280x900x24' sh -c 'openbox >/tmp/celmux-qt-wm.log 2>&1 & wm=$!; trap "kill $wm" EXIT; "$1" --window-smoke-test --window-smoke-test-require-wm' sh "$runtime/celmux-desktop-qt"
      - name: Keep the asset
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux_linux_amd64_desktop.deb
          if-no-files-found: error
          path: source/dist/celmux_linux_amd64_desktop.deb
      - name: Report the failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          asset: celmux-linux-amd64-desktop

  qt-windows-backend:
    name: Qt runtime host / Windows GNU
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the backend source out
        uses: ./.github/actions/fetch-source
        with:
          source-ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          cache-key: celmux-qt-windows-backend
      - uses: ./.github/actions/mingw-toolchain
      - name: Build the independent runtime host
        working-directory: source
        run: |
          set -euo pipefail
          amrwb=$(sh scripts/build-amrwb-native.sh x86_64-pc-windows-gnu)
          evs=$(sh scripts/build-evs-native.sh x86_64-pc-windows-gnu)
          CELMUX_AMRWB_NATIVE=1 CELMUX_AMRWB_NATIVE_LIB_DIR="$amrwb" \
          CELMUX_EVS_NATIVE=1 CELMUX_EVS_NATIVE_LIB_DIR="$evs" \
          cargo build -p celmux-desktop-runtime --bin celmux-desktop-host --release --locked --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux-qt-windows-backend
          if-no-files-found: error
          path: source/target/x86_64-pc-windows-gnu/release/celmux-desktop-host.exe

  win-amd64-desktop:
    name: celmux_win_amd64_desktop.exe
    needs: [plan, qt-windows-backend]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CELMUX_BUILD_TAG: ${{ needs.plan.outputs.version }}
      QT_VERSION_MAJOR: '6'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the Qt source out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: anti-rainer/celmux
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CELMUX_PAT }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: qt-bundle-windows-msvc-6.12.0-${{ hashFiles('source/Cargo.lock') }}
      - name: Install Qt 6.12 MSVC SDK
        shell: pwsh
        working-directory: source
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { throw 'aqtinstall installation failed' }
          python scripts/install-qt-sdk.py install-qt windows desktop 6.12.0 win64_msvc2022_64 -O C:/Qt --archives qtbase qtdeclarative qtsvg qttools qttranslations
          if ($LASTEXITCODE -ne 0) { throw 'Qt SDK installation failed' }
          & C:/Qt/6.12.0/msvc2022_64/bin/qmake.exe -query QT_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Qt tool runtime is incomplete' }
          python scripts/collect-qt-licenses.py 6.12.0 C:/Qt/6.12.0/Licenses
          if ($LASTEXITCODE -ne 0) { throw 'Qt license collection failed' }
          'C:/Qt/6.12.0/msvc2022_64/bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'QMAKE=C:/Qt/6.12.0/msvc2022_64/bin/qmake.exe' | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install NSIS (the Windows installer)
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          makensis -VERSION
          if ($LASTEXITCODE -ne 0) { throw 'makensis is not on PATH' }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: celmux-qt-windows-backend
          path: source/dist/backend
      - name: Build and deploy the Windows Qt bundle
        shell: pwsh
        working-directory: source
        run: |
          rustup target add x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust target installation failed' }
          cargo clippy -p celmux-desktop-qt --features qt --all-targets --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Qt shell Clippy failed' }
          cargo build -p celmux-desktop-qt --bin celmux-desktop-qt --features qt --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Qt shell build failed' }
          $redist = Get-ChildItem -LiteralPath $env:VCToolsRedistDir -Directory -Recurse | Where-Object Name -eq 'Microsoft.VC143.CRT' | Where-Object FullName -match '[\\/]x64[\\/]' | Select-Object -First 1
          if (-not $redist) { throw 'MSVC x64 redistributable directory not found' }
          & packaging/desktop/qt/build-windows.ps1 -Binary target/x86_64-pc-windows-msvc/release/celmux-desktop-qt.exe -BackendBinary dist/backend/celmux-desktop-host.exe -QtBin C:/Qt/6.12.0/msvc2022_64/bin -MsvcRuntimeDirectory $redist.FullName -QtLicenseDirectory C:/Qt/6.12.0/Licenses -Version $env:CELMUX_BUILD_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
          # The release asset name every installer and update panel expects:
          # this installer is the Windows desktop client.
          Move-Item -LiteralPath dist/celmux-desktop_win_amd64_setup.exe -Destination dist/celmux_win_amd64_desktop.exe
          if (-not (Test-Path dist/celmux_win_amd64_desktop.exe)) { throw 'Windows installer was not produced' }
          Expand-Archive -LiteralPath dist/celmux-desktop_win_amd64.zip -DestinationPath dist/qt-desktop-validation
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:QT_PLUGIN_PATH = $null
          $env:QML_IMPORT_PATH = $null
          $env:QT_QPA_PLATFORM = 'windows'
          & "$PWD/dist/qt-desktop-validation/celmux-desktop-host.exe" --ipc-smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Deployed backend IPC smoke failed' }
          $commands = Start-Process -FilePath "$PWD/dist/qt-desktop-validation/celmux-desktop-qt.exe" -ArgumentList '--window-command-smoke-test' -WindowStyle Hidden -RedirectStandardOutput "$PWD/dist/dashboard-command.json" -RedirectStandardError "$PWD/dist/dashboard-command.stderr" -PassThru -Wait
          Get-Content dist/dashboard-command.json
          Get-Content dist/dashboard-command.stderr
          if ($commands.ExitCode -ne 0) { throw "Qt deployed command API smoke failed: $($commands.ExitCode)" }
          foreach ($case in @('empty', 'partial')) {
            $scenario = Start-Process -FilePath "$PWD/dist/qt-desktop-validation/celmux-desktop-qt.exe" -ArgumentList '--window-command-smoke-test', '--fixture-case', $case -WindowStyle Hidden -RedirectStandardOutput "$PWD/dist/dashboard-$case.json" -RedirectStandardError "$PWD/dist/dashboard-$case.stderr" -PassThru -Wait
            Get-Content "dist/dashboard-$case.json"
            Get-Content "dist/dashboard-$case.stderr"
            if ($scenario.ExitCode -ne 0) { throw "Qt dashboard $case smoke failed: $($scenario.ExitCode)" }
          }
          foreach ($case in @('normal', 'empty', 'partial')) {
            $deviceUi = Start-Process -FilePath "$PWD/dist/qt-desktop-validation/celmux-desktop-qt.exe" -ArgumentList '--device-ui-smoke-test', '--fixture-case', $case -WindowStyle Hidden -RedirectStandardOutput "$PWD/dist/device-$case.json" -RedirectStandardError "$PWD/dist/device-$case.stderr" -PassThru -Wait
            Get-Content "dist/device-$case.json"
            Get-Content "dist/device-$case.stderr"
            if ($deviceUi.ExitCode -ne 0) { throw "Qt deployed device UI $case smoke failed: $($deviceUi.ExitCode)" }
          }
          $smoke = Start-Process -FilePath "$PWD/dist/qt-desktop-validation/celmux-desktop-qt.exe" -ArgumentList '--window-smoke-test', '--window-smoke-test-require-wm' -WindowStyle Hidden -RedirectStandardOutput "$PWD/dist/dashboard-windows-smoke.out" -RedirectStandardError "$PWD/dist/dashboard-windows-smoke.stderr" -PassThru -Wait
          Get-Content dist/dashboard-windows-smoke.out
          Get-Content dist/dashboard-windows-smoke.stderr
          if ($smoke.ExitCode -ne 0) { throw "Qt deployed window smoke failed: $($smoke.ExitCode)" }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux-desktop_win_amd64.zip
          if-no-files-found: error
          path: |
            source/dist/celmux-desktop_win_amd64.zip
            source/dist/celmux-desktop_win_amd64.zip.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux_win_amd64_desktop.exe
          if-no-files-found: error
          path: source/dist/celmux_win_amd64_desktop.exe

      - name: Preserve failed deployment for diagnosis
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: celmux-qt-windows-diagnostic
          if-no-files-found: warn
          path: |
            source/dist/celmux-desktop_win_amd64.zip
            source/dist/celmux-desktop_win_amd64.zip.sha256
            source/dist/dashboard-*
            source/dist/device-*

  publish:
    name: publish
    needs: [plan, checks, linux-amd64, linux-arm64, win-amd64, linux-amd64-desktop, win-amd64-desktop]
    permissions:
      contents: write
    # `always()` lets this job report a useful skip when a required build failed.
    if: >-
      ${{ always() && inputs.publish == true &&
          needs.plan.result == 'success' &&
          needs['checks'].result == 'success' &&
          needs['linux-amd64'].result == 'success' &&
          needs['linux-arm64'].result == 'success' &&
          needs['win-amd64'].result == 'success' &&
          needs['linux-amd64-desktop'].result == 'success' &&
          needs['win-amd64-desktop'].result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Collect the assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh release` needs to know which repository it is talking to, and
          # this job never checks the repository out: the assets it publishes
          # are the ones the build jobs uploaded, and checking out here would
          # only `git clean` the directory they were just downloaded into.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          ls -l assets

          # The five names a release carries. Build logs may be artifacts next
          # to these, so the list is explicit: `assets/*` would
          # publish those logs with the release.
          assets=()
          for name in celmux_linux_amd64 celmux_linux_arm64 celmux_win_amd64.exe \
                      celmux_linux_amd64_desktop.deb celmux_win_amd64_desktop.exe; do
            if [ -f "assets/$name" ]; then
              assets+=("assets/$name")
            fi
          done
          for name in celmux_linux_amd64 celmux_linux_arm64 celmux_win_amd64.exe \
                      celmux_linux_amd64_desktop.deb celmux_win_amd64_desktop.exe; do
            if [ ! -f "assets/$name" ]; then
              echo "::error::缺少资产 ${name}"
              exit 1
            fi
          done
          printf '本次发布的资产：\n'
          printf '  %s\n' "${assets[@]}"

          # Every installer and every operator checks the download against
          # this file, so it is generated from the assets that are about to be
          # published, not from a build directory that may still hold an older
          # run's output.
          ( cd assets && sha256sum "${assets[@]##*/}" > SHA256SUMS.txt )
          echo '--- SHA256SUMS.txt'
          cat assets/SHA256SUMS.txt

          # What a release with no notes of its own says: where it came from
          # and which asset installs what. A release that was given notes
          # publishes exactly those - the client shows the body in its update
          # panel, where a footer about installers is noise.
          footer=$(printf '%s\n' \
            "由 anti-rainer/celmux 的 ${REF}（${REVISION}）构建。" \
            '' \
            'Linux 服务端用 install.sh 安装，Windows 服务端用 install.ps1 安装；' \
            'Linux Qt 桌面端是 celmux_linux_amd64_desktop.deb；Windows Qt 桌面端' \
            '是 celmux_win_amd64_desktop.exe 安装程序（自带卸载程序）。')
          if [ -n "${NOTES:-}" ]; then
            # The dispatch form is one line; `\n` in it is what gives the
            # release a body with one change per line.
            notes=$(printf '%b\n' "$NOTES")
          else
            notes=$footer
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" assets/SHA256SUMS.txt --clobber
            # Only a filled-in body replaces one: re-uploading an asset must
            # not overwrite notes somebody edited in the web interface.
            if [ -n "${NOTES:-}" ]; then
              printf '%s' "$notes" | gh release edit "$TAG" --notes-file -
            fi
          else
            printf '%s' "$notes" | gh release create "$TAG" "${assets[@]}" \
              assets/SHA256SUMS.txt --title "$TAG" --notes-file -
          fi

  # The report is the last thing that happens and runs whatever the build did:
  # a run that fails is exactly the one worth a message.
  notify:
    name: telegram
    needs: [plan, checks, linux-amd64, linux-arm64, win-amd64, linux-amd64-desktop, win-amd64-desktop, publish]
    if: ${{ always() && inputs.notify == true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Report the run
        env:
          TGBOT_TOKEN: ${{ secrets.TGBOT_TOKEN }}
          TGBOT_CHATID: ${{ secrets.TGBOT_CHATID }}
          VERSION: ${{ needs.plan.outputs.version }}
          REF: ${{ inputs.source_ref }}
          REVISION: ${{ needs.plan.outputs.revision }}
          PLAN_RESULT: ${{ needs.plan.result }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          LINUX_AMD64: ${{ needs['linux-amd64'].result }}
          LINUX_ARM64: ${{ needs['linux-arm64'].result }}
          WIN_AMD64: ${{ needs['win-amd64'].result }}
          LINUX_DESKTOP: ${{ needs['linux-amd64-desktop'].result }}
          WIN_DESKTOP: ${{ needs['win-amd64-desktop'].result }}
          CHECKS: ${{ needs['checks'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.version }}
        run: |
          set -eu
          if [ -z "${TGBOT_TOKEN:-}" ] || [ -z "${TGBOT_CHATID:-}" ]; then
            echo 'TGBOT_TOKEN 或 TGBOT_CHATID 未配置，跳过通知。'
            exit 0
          fi

          state() {
            case "${1:-}" in
              success) printf '成功' ;;
              failure) printf '失败' ;;
              cancelled) printf '已取消' ;;
              skipped) printf '跳过' ;;
              '') printf '未运行' ;;
              *) printf '%s' "$1" ;;
            esac
          }

          failed=0
          for result in "${LINUX_AMD64:-}" "${LINUX_ARM64:-}" "${WIN_AMD64:-}" \
                        "${LINUX_DESKTOP:-}" "${WIN_DESKTOP:-}"; do
            [ "$result" = 'success' ] || failed=1
          done
          release='未发布（产物在本次运行里）'
          if [ "${PUBLISH:-}" = 'true' ]; then
            case "${PUBLISH_RESULT:-}" in
              success) release="已发布 ${RELEASE_URL}" ;;
              skipped) release='未发布（构建未通过）' ;;
              *) release="发布失败（$(state "$PUBLISH_RESULT")）"; failed=1 ;;
            esac
          fi

          headline='celmux 构建成功'
          [ "$failed" -eq 0 ] || headline='celmux 构建失败'
          version="${VERSION:-未知}"
          [ "${PLAN_RESULT:-}" = 'success' ] || version="$version（构建准备$(state "${PLAN_RESULT:-}")）"
          message=$(printf '%s\n' \
            "$headline" \
            "版本：${version}" \
            "源码：${REF:-未知} @ ${REVISION:-未知}" \
            "构建准备：$(state "${PLAN_RESULT:-}")" \
            "检查：$(state "${CHECKS:-}")" \
            "celmux_linux_amd64：$(state "${LINUX_AMD64:-}")" \
            "celmux_linux_arm64：$(state "${LINUX_ARM64:-}")" \
            "celmux_win_amd64.exe：$(state "${WIN_AMD64:-}")" \
            "celmux_linux_amd64_desktop.deb：$(state "${LINUX_DESKTOP:-}")" \
            "celmux_win_amd64_desktop.exe：$(state "${WIN_DESKTOP:-}")" \
            "Release：${release}" \
            "运行：${RUN_URL}")

          curl -fsS -X POST "https://api.telegram.org/bot${TGBOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TGBOT_CHATID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode 'disable_web_page_preview=true' >/dev/null
          echo '已发送 Telegram 通知'
